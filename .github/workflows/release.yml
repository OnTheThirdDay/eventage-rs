# Release binaries.
#
# One self-contained executable per tool per platform, attached to a GitHub
# release. No archive to unpack and nothing to install beside them: download,
# `chmod +x`, run.
#
# That "nothing beside them" is a property the code has to hold up, not just
# the packaging. On Linux the coding agent confines shell commands by
# re-executing a trampoline that installs the Landlock ruleset in a fresh
# single-threaded process. In a source checkout that trampoline is a sibling
# binary, `eventage-confine`; a lone downloaded executable has no sibling, and
# would otherwise find no helper and run every "confined" command unconfined —
# silently, which is the worst way for a sandbox to fail. `run_if_helper`
# declares that the program handles the marker, so a shipped binary
# trampolines through itself. `eventage-confine` is still published for
# packagers who split things up.
#
# Studio embeds its front-end at compile time, so the UI is built before cargo
# runs — the same reason the CI workflow does it.
name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed without cutting a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as (leave blank to build only)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: binaries link against the runner's
          # glibc, and building on the newest image produces something that
          # refuses to start on anything older.
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Studio's front-end is embedded at compile time from `ui/dist`, which
      # is a build artifact and not in the checkout.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/eventage-studio/ui/package-lock.json
      - name: Build the Studio front-end
        working-directory: crates/eventage-studio/ui
        run: npm ci && npm run build

      - name: Build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p example-coding-agent -p eventage-studio -p example-cowork

      # Named by platform so several can sit in one downloads folder, which is
      # what actually happens when somebody tries two machines.
      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/${{ matrix.target }}/release"
          ext=""
          [[ "${{ matrix.os }}" == windows-* ]] && ext=".exe"
          for name in eventage-code eventage-studio cowork eventage-confine; do
            src="$bin/$name$ext"
            if [[ ! -f "$src" ]]; then
              echo "missing expected binary: $src" >&2
              exit 1
            fi
            cp "$src" "dist/$name-${{ matrix.label }}$ext"
          done
          ls -l dist

      # Proof the artefact starts, on the machine that built it. A binary that
      # cannot run is the one failure a build log will not show you.
      - name: Smoke-test
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [[ "${{ matrix.os }}" == windows-* ]] && ext=".exe"
          # Cross-compiled x86_64 will not run on an arm64 runner.
          if [[ "${{ matrix.label }}" == "macos-x86_64" ]]; then
            echo "cross-compiled; skipping execution"
            exit 0
          fi
          for name in eventage-code eventage-studio cowork; do
            "./dist/$name-${{ matrix.label }}$ext" --version
          done

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-${{ matrix.label }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.label }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # Studio in a native window, as an installable package rather than a bare
  # executable. Separate from `build` because it is a different kind of
  # artifact: it needs the system webview, a bundler, and per-platform
  # packaging, and none of that should be able to hold up the plain binaries.
  # `fail-fast: false` is what keeps one platform's packaging trouble from
  # cancelling the other two.
  desktop:
    name: desktop ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          # One Universal dmg rather than one per architecture: it is what Mac
          # applications ship as, and the alternative is two downloads plus a
          # user deciding which of them they are.
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A Universal binary is two builds stitched together, so both halves
          # have to be installed.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          # The shell is its own workspace — see the root manifest for why it
          # is excluded — so the cache has to be pointed at it.
          workspaces: crates/eventage-studio-desktop

      # Linux is the only platform where the webview is not part of the OS.
      # WebKitGTK is the webview itself; patchelf and the rest are what the
      # AppImage bundler shells out to.
      - name: System webview and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev libxdo-dev build-essential pkg-config \
            patchelf file desktop-file-utils

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/eventage-studio/ui/package-lock.json
      - name: Build the Studio front-end
        working-directory: crates/eventage-studio/ui
        run: npm ci && npm run build

      # From npm rather than `cargo install`: it is the same official CLI as a
      # prebuilt binary, and compiling it from source on every run costs more
      # than the build it is there to drive.
      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # linuxdeploy and its plugins are fetched by the AppImage bundler at
      # build time. Kept across runs because every one of those downloads is
      # guarded by `if !path.exists()`, so a populated cache means the bundler
      # makes no network calls at all.
      - name: Cache the AppImage bundler's tools
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-appimage-tools-x86_64

      # And fetch them here rather than letting the bundler do it, because it
      # downloads without retrying and raw.githubusercontent.com rate-limits
      # shared CI egress: a release build died on `http status: 429` reaching
      # for linuxdeploy-plugin-gtk.sh. curl retries; the bundler does not.
      #
      # The names are the ones the bundler looks for, which are not always the
      # names in the URLs — the AppImage plugin is fetched as
      # `…-plugin-appimage-x86_64.AppImage` and looked for as
      # `…-plugin-appimage.AppImage`, and a mismatch here would leave a file
      # nobody reads and the download still happening at build time.
      - name: Prefetch the AppImage bundler's tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tools="$HOME/.cache/tauri"
          mkdir -p "$tools"
          fetch() {
            local name="$1" url="$2" required="$3"
            if [[ -f "$tools/$name" ]]; then
              echo "cached:  $name"
              return
            fi
            if curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors -o "$tools/$name" "$url"; then
              chmod +x "$tools/$name"
              echo "fetched: $name"
            elif [[ "$required" == required ]]; then
              echo "could not fetch $name from $url" >&2
              exit 1
            else
              # The bundler treats this one as optional and falls back to its
              # own built-in copy, so a failure here must not stop the build.
              rm -f "$tools/$name"
              echo "skipped: $name (optional)"
            fi
          }
          releases=https://github.com/tauri-apps/binary-releases/releases/download
          raw=https://raw.githubusercontent.com/tauri-apps
          fetch AppRun-x86_64 "$releases/apprun-old/AppRun-x86_64" required
          fetch linuxdeploy-x86_64.AppImage "$releases/linuxdeploy/linuxdeploy-x86_64.AppImage" required
          fetch linuxdeploy-plugin-gtk.sh "$raw/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" required
          fetch linuxdeploy-plugin-gstreamer.sh "$raw/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh" required
          fetch linuxdeploy-plugin-appimage.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" \
            optional
          ls -l "$tools"

      # The bundle list is quoted because this step runs under PowerShell on
      # Windows, where a bare `msi,nsis` is an *array* and reaches the CLI as
      # the single value "msi nsis" — which it rightly rejected. Quoting makes
      # it one literal argument in every shell.
      - name: Bundle
        working-directory: crates/eventage-studio-desktop
        run: tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}"

      # Bundle filenames carry the product name and version ("Eventage
      # Studio_0.2.0_amd64.deb"), which is right for a package manager and
      # wrong for a downloads folder holding three platforms at once. Renamed
      # by platform, keeping each format's extension because that is what
      # tells the OS how to open it.
      - name: Stage bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          root="crates/eventage-studio-desktop/target/${{ matrix.target }}/release/bundle"
          while IFS= read -r -d '' src; do
            case "$src" in
              *.deb|*.AppImage|*.dmg|*.msi|*-setup.exe) ;;
              *) continue ;;
            esac
            ext="${src##*.}"
            [[ "$src" == *-setup.exe ]] && ext="setup.exe"
            cp "$src" "dist/eventage-studio-desktop-${{ matrix.label }}.$ext"
            found=$((found + 1))
          done < <(find "$root" -type f -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "the bundler produced nothing under $root" >&2
            find "crates/eventage-studio-desktop/target" -maxdepth 4 -type d >&2 || true
            exit 1
          fi
          ls -l dist

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-desktop-${{ matrix.label }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-desktop-${{ matrix.label }}.txt"
          fi
          cat "SHA256SUMS-desktop-${{ matrix.label }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, desktop]
    runs-on: ubuntu-latest
    # Only a tag produces a release; a manual run stops at the artefacts
    # unless it was given a tag on purpose.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Download the binary for your platform, make it executable, and run it.

            | Tool | What it is |
            |---|---|
            | `eventage-code` | The coding agent. ACP server by default; `run` for one headless prompt. |
            | `eventage-studio` | Web UI over a session — transcript, event trace, timeline, rewind. |
            | `cowork` | Parallel workstreams over a folder, compared before anything is kept. |
            | `eventage-confine` | The Linux sandbox trampoline. Only needed if you split the binaries up; each tool can act as its own. |

            ```sh
            chmod +x eventage-code-linux-x86_64
            ./eventage-code-linux-x86_64 --help
            ```

            Verify with `SHA256SUMS-<platform>.txt`.

            ### Studio as a desktop app

            `eventage-studio-desktop-*` is the same Studio in a native window
            instead of a browser tab — `.dmg` for macOS (Universal), `.msi` or
            `.setup.exe` for Windows, `.deb` or `.AppImage` for Linux. It renders
            through the system webview, so on Linux it needs WebKitGTK
            (`libwebkit2gtk-4.1-0`); the plain `eventage-studio` binary needs
            nothing and opens your browser instead.

            Started from an icon it opens your home directory, since there is no
            working directory to inherit — use the workspace picker, or pass
            `--cwd <dir>` from a shortcut or `.desktop` entry.

            The packages are **not code-signed**. macOS will refuse the first
            launch: right-click the app and choose Open, or
            `xattr -d com.apple.quarantine "/Applications/Eventage Studio.app"`.
            Windows SmartScreen will warn; choose More info → Run anyway.

            Shell containment uses Landlock and seccomp, which are Linux only.
            On macOS and Windows commands run with credentials scrubbed, their
            own process group and resource limits, but no filesystem or
            network confinement — `--sandbox container` is the portable
            boundary.
