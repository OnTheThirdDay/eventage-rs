# The workspace moves fast and by hand; this is the floor everything has to
# clear. Warnings are denied rather than reported, because a warning nobody
# is forced to read is a warning that accumulates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A test that hangs otherwise runs until the six-hour default and tells
    # you nothing. The suite takes about two minutes; twenty is generous and
    # still fails while somebody is looking.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          # The workspace confinement and shell containment take different
          # paths off Linux, and only a real macOS runner exercises them.
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Studio embeds its front-end at compile time from `ui/dist`, which is a
      # build artifact and so is not in the checkout. Without this the Rust
      # job compiled a Studio with no UI in it, and the test that asks the
      # deep-link route for an HTML document failed with nothing to say about
      # why. Building it here means the binary CI tests is the binary we ship.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/eventage-studio/ui/package-lock.json
      - name: Build the Studio front-end
        working-directory: crates/eventage-studio/ui
        run: npm ci && npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `--all-features` matters: it is the only place several features are
      # compiled, and it is what caught a hang that a plain `cargo test` did
      # not run at all.
      - name: Test
        run: cargo test --workspace --all-features

      # Feature flags are the crate's public surface, and a combination that
      # does not build is only discovered when somebody depends on it.
      - name: Build with no default features
        run: cargo build --no-default-features

      - name: Build with default features
        run: cargo build

      # Strict now that the workspace's intra-doc links are clean. A broken
      # link is a documentation defect like any other, and the only way it
      # stays fixed is if it fails the build.
      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  ui:
    name: studio ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/eventage-studio/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/eventage-studio/ui/package-lock.json
      - run: npm ci
      # `--force`: build mode is incremental, and an up-to-date build info
      # lets it report success for a file it never rechecked. A type error
      # once reached CI from a machine where the local check had just passed.
      - run: npm run check
      - run: npx vitest run
      # The built assets are embedded in the Rust binary, so a broken build
      # here is a broken release.
      - run: npm run build
