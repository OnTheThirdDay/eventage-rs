[package]
name = "eventage-sqlite"
version = "0.1.0"
edition = "2021"

[features]
# Bundle the SQLite library statically (no system SQLite required).
# Increases compile time but improves portability.
bundled = ["rusqlite/bundled"]

[dependencies]
eventage-core = { workspace = true }
eventage-observability = { workspace = true }
rusqlite = "0.32"
tokio = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
