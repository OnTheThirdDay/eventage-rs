[package]
name  = "example-coding-agent"
version = "0.2.0"
edition = "2021"
publish = false
description = "eventage-code — an ACP agent server: LSP-aware coding agent for editors"

[lib]
name = "eventage_code"
path = "src/lib.rs"

[[bin]]
name = "eventage-code"
path = "src/main.rs"

[dependencies]
eventage           = { path = "../..", features = ["observability", "sqlite-bundled", "mcp", "sandbox"] }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
async-trait        = "0.1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid               = { version = "1", features = ["v4"] }
chrono             = { version = "0.4", features = ["serde"] }
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
dirs               = "5"
glob               = "0.3"
regex              = "1"
walkdir            = "2"
similar            = { version = "2.6", features = ["text"] }
base64             = "0.22"
ignore             = "0.4"

[dev-dependencies]
tempfile = "3"
