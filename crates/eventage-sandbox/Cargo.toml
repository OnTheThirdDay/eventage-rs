[package]
name = "eventage-sandbox"
version = "0.1.0"
edition = "2021"
description = "Modular sandboxed execution for Eventage agent tools"

[features]
# WASM-based sandboxed execution via wasmtime + WASI.
# Adds WasmExecutor to the crate.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
async-trait = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }

# Optional: WASM execution backend (feature-gated)
wasmtime      = { version = "28", optional = true }
wasmtime-wasi = { version = "28", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
nix      = { version = "0.29", features = ["process", "signal", "user"] }
